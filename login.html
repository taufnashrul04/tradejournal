<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Trading Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-inner">
        <div class="auth-header">
          <div class="logo">📈</div>
          <div class="auth-eyebrow">Trading Journal</div>
          <h1>Selamat datang</h1>
          <p>Masuk untuk mulai catat trade kamu</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <div class="tab-switcher">
          <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
          <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
        </div>

        <!-- Form Login -->
        <form id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group" style="margin-bottom:14px">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="email@kamu.com" required>
          </div>
          <div class="form-group" style="margin-bottom:20px">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Password" required>
          </div>
          <button type="submit" class="btn-primary" id="btn-login" style="width:100%;justify-content:center">
            <span class="btn-text">Masuk</span>
            <span class="btn-loading hidden">Memproses...</span>
          </button>
        </form>

        <!-- Form Register -->
        <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
          <div class="form-group" style="margin-bottom:14px">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="Username kamu" required>
          </div>
          <div class="form-group" style="margin-bottom:14px">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="email@kamu.com" required>
          </div>
          <div class="form-group" style="margin-bottom:20px">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Min. 6 karakter" required minlength="6">
          </div>
          <button type="submit" class="btn-primary" id="btn-register" style="width:100%;justify-content:center">
            <span class="btn-text">Buat Akun</span>
            <span class="btn-loading hidden">Memproses...</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'dashboard.html';
    });

    function switchTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideAlert();
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert ${type}`;
    }

    function hideAlert() {
      document.getElementById('alert').className = 'alert hidden';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.querySelector('.btn-text').classList.toggle('hidden', loading);
      btn.querySelector('.btn-loading').classList.toggle('hidden', !loading);
      btn.disabled = loading;
    }

    async function handleLogin(e) {
      e.preventDefault();
      setLoading('btn-login', true);
      hideAlert();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showAlert(error.message || 'Email atau password salah.');
      } else {
        window.location.href = 'dashboard.html';
      }
      setLoading('btn-login', false);
    }

    async function handleRegister(e) {
      e.preventDefault();
      setLoading('btn-register', true);
      hideAlert();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const { error } = await sb.auth.signUp({
        email, password,
        options: { data: { username } }
      });
      if (error) {
        showAlert(error.message);
      } else {
        showAlert('Akun berhasil dibuat! Silakan masuk.', 'success');
        switchTab('login');
      }
      setLoading('btn-register', false);
    }
  </script>
</body>
</html>
