<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .journal-topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-top: 4px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.2s var(--ease-snap);
      flex-shrink: 0;
    }
    .btn-back:hover { background: var(--surface-hi); color: var(--text); border-color: var(--border-hi); }

    .journal-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .journal-title-emoji {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .journal-title-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .journal-title-badge {
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar-wrap">
    <nav class="navbar">
      <div class="nav-brand">
        <div class="nav-brand-icon">📈</div>
        Trading Journal
      </div>
      <div class="nav-right">
        <span id="nav-username" class="nav-username"></span>
        <button class="btn-logout" onclick="logout()">Keluar</button>
      </div>
    </nav>
  </div>

  <div class="main-container">
    <!-- Journal header -->
    <div class="journal-topbar reveal">
      <a class="btn-back" href="dashboard.html">← Kembali</a>
      <div class="journal-title-row">
        <div class="journal-title-emoji" id="j-emoji-icon" style="background:#7c6ff722;border:1px solid #7c6ff733">📊</div>
        <div class="journal-title-text" id="j-title">Journal</div>
        <span class="journal-title-badge" id="j-type-badge" style="color:#7c6ff7;border-color:#7c6ff733;background:#7c6ff711"></span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card reveal reveal-d1">
        <div class="stat-label">Total Trade</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card win reveal reveal-d2">
        <div class="stat-label">Win</div>
        <div class="stat-value" id="stat-win">0</div>
      </div>
      <div class="stat-card loss reveal reveal-d3">
        <div class="stat-label">Loss</div>
        <div class="stat-value" id="stat-loss">0</div>
      </div>
      <div class="stat-card pnl reveal reveal-d4">
        <div class="stat-label">Total PNL</div>
        <div class="stat-value" id="stat-pnl">0</div>
      </div>
      <div class="stat-card winrate reveal reveal-d5">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value" id="stat-winrate">0%</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar reveal">
      <button class="btn-primary" onclick="openModal()">+ Tambah Trade</button>
      <div class="filters">
        <input type="month" id="filter-month" onchange="loadTrades()">
        <select id="filter-hasil" onchange="loadTrades()">
          <option value="">Semua Hasil</option>
          <option value="Win">Win</option>
          <option value="Loss">Loss</option>
          <option value="BE">BE</option>
        </select>
        <select id="filter-posisi" onchange="loadTrades()">
          <option value="">Semua Posisi</option>
          <option value="Long">Long</option>
          <option value="Short">Short</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper reveal">
      <table id="trade-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Hari / Tanggal</th>
            <th>Entry Model</th>
            <th>Pair</th>
            <th>Session</th>
            <th>TF Entry</th>
            <th>Posisi</th>
            <th>Hasil</th>
            <th>PNL ($)</th>
            <th>Bukti</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="trade-body">
          <tr><td colspan="11" class="empty-state">Belum ada data trade</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Tambah/Edit Trade -->
  <div id="modal" class="modal-overlay hidden" onclick="closeModalOutside(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Tambah Trade</h2>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <form id="trade-form" onsubmit="saveTrade(event)">
        <input type="hidden" id="trade-id">
        <div class="form-grid">
          <div class="form-group">
            <label>Tanggal *</label>
            <input type="date" id="f-tanggal" required>
          </div>
          <div class="form-group">
            <label>Entry Model</label>
            <input type="text" id="f-entry-model" placeholder="SMC, ICT, PA...">
          </div>
          <div class="form-group">
            <label>Pair *</label>
            <input type="text" id="f-pair" placeholder="XAUUSD, EURUSD..." required>
          </div>
          <div class="form-group">
            <label>Session</label>
            <select id="f-session">
              <option value="">Pilih Session</option>
              <option value="Asian">Asian</option>
              <option value="London">London</option>
              <option value="New York">New York</option>
              <option value="London Close">London Close</option>
            </select>
          </div>
          <div class="form-group">
            <label>Timeframe Entry</label>
            <select id="f-timeframe">
              <option value="">Pilih TF</option>
              <option value="M1">M1</option>
              <option value="M5">M5</option>
              <option value="M15">M15</option>
              <option value="M30">M30</option>
              <option value="H1">H1</option>
              <option value="H4">H4</option>
              <option value="D1">D1</option>
              <option value="W1">W1</option>
            </select>
          </div>
          <div class="form-group">
            <label>Posisi</label>
            <select id="f-posisi">
              <option value="">Pilih</option>
              <option value="Long">Long</option>
              <option value="Short">Short</option>
            </select>
          </div>
          <div class="form-group">
            <label>Hasil</label>
            <select id="f-hasil">
              <option value="">Pilih</option>
              <option value="Win">Win</option>
              <option value="Loss">Loss</option>
              <option value="BE">BE (Breakeven)</option>
            </select>
          </div>
          <div class="form-group">
            <label>PNL ($)</label>
            <input type="number" id="f-pnl" placeholder="50 atau -30" step="0.01">
          </div>
          <div class="form-group full-width">
            <label>Upload Bukti</label>
            <input type="file" id="f-bukti" accept="image/*">
            <div id="bukti-preview" class="bukti-preview hidden">
              <img id="bukti-img" alt="Bukti trade">
              <button type="button" onclick="clearBukti()">Hapus Gambar</button>
            </div>
          </div>
          <div class="form-group full-width">
            <label>Catatan</label>
            <textarea id="f-catatan" rows="3" placeholder="Analisa atau catatan tambahan..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn-primary" id="btn-save">
            <span class="btn-text">Simpan</span>
            <span class="btn-loading hidden">Menyimpan...</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Preview Gambar -->
  <div id="img-modal" class="modal-overlay hidden" onclick="closeImgModal()">
    <div class="img-modal-card">
      <img id="img-modal-src" alt="Bukti Trade">
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
    }, { threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
